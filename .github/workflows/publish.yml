# 판 번호 태그(예: v0.1.32)를 push하면 vsix를 한 번 만들어 VS Code 마켓플레이스와 Open VSX(Cursor)에 함께 올린다.
# 두 곳 다 신뢰 출시(OIDC)라 저장해 둘 토큰이 없다. 두 사이트에 이 레포와 이 파일 이름(publish.yml)을 등록해 두어야 한다.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      # 태그와 package.json 판 번호가 다르면 멈춘다(엉뚱한 판을 올리지 않게).
      - run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npx --yes @vscode/vsce@4.1.1 package -o game-csv-viewer.vsix
      # 한쪽만 올라가고 멈췄을 때 다시 돌릴 수 있게, 이미 있는 판은 건너뛴다.
      - run: npx --yes @vscode/vsce@4.1.1 publish --oidc --skip-duplicate --packagePath game-csv-viewer.vsix
      - run: npx --yes ovsx@1.4.0 publish --trusted-publishing --skip-duplicate --packagePath game-csv-viewer.vsix
